apiVersion: batch/v1
kind: CronJob
metadata:
  name: unsealer
  namespace: vault
spec:
  schedule: "*/5 * * * *"
  failedJobsHistoryLimit: 1
  successfulJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: unsealer
              image: curlimages/curl:8.6.0
              command:
                - /bin/sh
                - /unseal.sh
              envFrom:
                - secretRef:
                    name: vault-unsealer
              env:
                - name: VAULT_URL
                  value: http://vault:8200
              volumeMounts:
                - name: script
                  mountPath: /unseal.sh
                  subPath: unseal.sh
          volumes:
            - name: script
              configMap:
                name: vault-unsealer
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-unsealer
  namespace: vault
data:
  unseal.sh: |
    #!/bin/bash
    sealed=$(curl -s ${VAULT_URL}/v1/sys/seal-status | grep '"sealed":true')

    if [ -z "$sealed" ]; then
        echo "Vault is already unsealed."
        exit 0
    fi

    echo "Vault is sealed. Attempting to unseal..."

    for key in $(echo "$VAULT_UNSEAL_KEYS" | tr "," " "); do
        curl -s \
          --request POST \
          --header "Content-Type: application/json" \
          --data "{\"key\": \"$key\"}" \
          ${VAULT_URL}/v1/sys/unseal >/dev/null
    done
    echo "Unseal request completed."
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vault-unsealer
  namespace: vault
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: vault-unsealer
    creationPolicy: Orphan
  dataFrom:
    - extract:
        key: vault-unsealer
